<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REHAB PRO 4.0 - EBM 컨디셔닝 에이전트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@google/genai@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="bg-emerald-500 text-slate-950 text-xs font-bold px-2 py-1 rounded">PRO</span>
            <h1 class="font-bold text-lg tracking-tight">REHAB PRO <span class="text-xs text-emerald-400 font-normal">v4.6 EBM</span></h1>
        </div>
        <div class="flex items-center space-x-2">
            <span id="licenseStatus" class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-600 px-2 py-1 rounded font-medium">🔑 정품 인증 완료</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-6">

        <!-- 1. 증상 선택 섹션 -->
        <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-sm text-emerald-400 uppercase tracking-wider">🎯 40가지 증상 및 기능 평가 체크리스트</h2>
                <span id="checkedCount" class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">0개 선택됨</span>
            </div>
            <p class="text-xs text-slate-400 mb-3">회원에게 해당하는 증상을 복수 선택하세요. (각 항목의 'TEST 보기'로 평가법 확인 가능)</p>
            
            <!-- 증상 리스트 (평가법 상세보기 포함) -->
            <div id="symptomList" class="space-y-2 max-h-64 overflow-y-auto pr-1 text-sm">
                <!-- 동적 생성 -->
            </div>
        </section>

        <!-- 2. AI 분석 실행 버튼 -->
        <button id="generateBtn" onclick="generateReport()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
            <span>✨ 시각적 해부학 카드 리포트 렌더링</span>
        </button>

        <!-- 3. 결과 렌더링 카드 영역 -->
        <section id="resultSection" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-semibold text-sm text-emerald-400 uppercase tracking-wider">📋 AI 맞춤 컨디셔닝 & TP 리포트</h3>
                <button onclick="window.print()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-slate-300">🖨️ 리포트 출력</button>
            </div>
            <div id="cardContainer" class="space-y-4">
                <!-- 카드 리포트 동적 삽입 -->
            </div>
        </section>

    </main>

    <footer class="bg-slate-950 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        &copy; 2026 REHAB PRO. All rights reserved. Serverless Vercel PWA Engine.
    </i></footer>

    <script>
        // 40가지 증상 DB (TEST 검사법 및 TP 데이터 포함)
        const symptomDatabase = [
            { id: 1, name: "상부승모근 TP (긴장성 두통)", test: "어깨를 귀 쪽으로 으쓱하게 한 뒤 저항을 주어 통증 및 수축력 비대칭 확인", loc: "상부 목덜미, 어깨 세모근 상단", pain: "목 뻐근함, 눈 뒤쪽 및 관자놀이로 방사되는 두통", cause: "장시간 라운드숄더 및 거북목으로 인한 과긴장", mfr: "폼롤러 및 마사지볼로 상부 승모근 부위 8분간 부드럽게 이완", mob: "경추 측굴 및 회전 가동성 확보 스트레칭 (각 방향 10초 유지)", act: "중하부 승모근 및 능형근 활성화 운동 (밴드 풀아파트 15회 3세트)", pas: "수건을 이용한 경추 신전 및 상부 승모근 정적 스트레칭", tip: "회원님의 목 뒤 뻐근함과 두통은 상부 승모근 트리거 포인트가 머리로 가는 신경을 압박하기 때문입니다." },
            { id: 2, name: "흉쇄유돌근 TP (어지러움/두통)", test: "고개를 반대쪽으로 돌린 상태에서 턱을 위로 들어 올리며 흉쇄유돌근 긴장도 촉지", loc: "목 앞쪽 측면 (귀 뒤에서 쇄골 안쪽)", pain: "이내 어지러움, 안구 통증, 이명 느낌, 두통", cause: "거북목 자세로 인한 SCM 근육의 지속적인 단축성 긴장", mfr: "SCM 근육 주행 방향을 따라 손가락 끝으로 가볍게 림프 및 근막 이완", mob: "목 굴곡 및 회전 능동 관절 가동 범위 회복 운동", act: "심부 경추 굴곡근(Deep Neck Flexors) 활성화 운동", pas: "측경부 신전 스트레칭", tip: "어지러움과 편두통은 목 앞쪽 SCM 긴장이 원인일 수 있습니다. 가벼운 이완 후 안정화 운동을 진행합니다." },
            { id: 3, name: "사각근 증후군 (팔 저림)", test: "Adson Test (고개를 환측으로 돌리고 심호흡 시 요골동맥 맥박 소실 여부 확인)", loc: "목 측면 (전/중 사각근)", pain: "팔 저림, 손가락 핀 당김, 쇄골 아래 찌릿함", cause: "호흡 시 흉곽 부조화 및 사각근 비대화로 인한 상완신경총 압박", mfr: "쇄골 상단 사각근 기시부 부드러운 압박 이완 (8분)", mob: "흉곽 확장 호흡 패턴 교정 및 경추 측면 스트레칭", act: "전거근 및 흉곽 안정화 운동", pas: "사각근 및 흉쇄근 복합 스트레칭", tip: "팔 저림 증상은 목 사각근이 신경을 압박해서 발생합니다. 호흡 교정과 사각근 이완이 필수입니다." },
            { id: 4, name: "소흉근 단축 (라운드숄더/찝힘)", test: "앙와위에서 어깨가 바닥으로부터 들리는지 확인 (Pectoralis Minor Length Test)", loc: "가슴 앞쪽 상단 (오훼돌기 부근)", pain: "어깨 전면 찝힘(Impingement), 팔 저림", cause: "PC 작업 및 굽은 등로 인한 소흉근 단축", mfr: "라크로스 볼을 이용한 소흉근 및 오훼돌기 주변 근막 이완", mob: "흉추 신전 폼롤러 롤링 및 가슴 열기 스트레칭", act: "하부 승모근 및 회전근개 강화 운동", pas: "문틀을 이용한 대/소흉근 스트레칭", tip: "어깨 앞쪽 찝힘은 소흉근이 짧아져 견갑골을 앞으로 잡아당기기 때문입니다." },
            { id: 5, name: "전거근 약화 (익상견갑)", test: "Wall Push-up 시 견갑골 내측연이 들뜨는가 확인 (Scapular Winging)", loc: "갈비뼈 측면 (겨드랑이 아래)", pain: "푸시업 시 날개뼈 통증, 어깨 안정성 저하", cause: "전거근 기능 저하로 인한 견갑골 흉곽 고정력 상실", mfr: "측면 늑골 부위 전거근 수동 압박 이완", mob: "견갑골 전인/후인 가동성 훈련", act: "월 슬라이드 및 푸시업 플러스(Push-up Plus) 강화 운동", pas: "측면 늑골 근막 신전 스트레칭", tip: "푸시업 시 날개뼈가 뜨는 현상은 전거근 약화가 주원인입니다. 날개뼈 밀어내는 힘을 길러야 합니다." },
            { id: 6, name: "능형근 만성 쑤심 (날개뼈 사이)", test: "양팔을 앞으로 교차하여 견갑골 사이 근육의 신전성 및 압통 확인", loc: "견갑골 안쪽 척추 사이", pain: "날개뼈 사이 묵직하고 쑤시는 통증", cause: "라운드숄더로 인해 능형근이 늘어난 상태로 과긴장", mfr: "등 뒤 견갑골 사이 마사지볼 이완 (8분)", mob: "흉추 회전 및 견갑골 후인 가동성 확보", act: "시이티드 로우 및 밴드 풀아파트", pas: "견갑골 외전 및 능형근 이완 스트레칭", tip: "날개뼈 사이가 쑤시는 것은 등이 굽으면서 능형근이 만성적으로 피로해졌기 때문입니다." },
            { id: 7, name: "극상근 회전근개 부하", test: "Empty Can Test (Jobe Test) 시 통증 및 근력 저하 확인", loc: "어깨 관절 상단 (견봉 아래)", pain: "팔을 60~120도 사이로 들 때 어깨 외측 찌릿한 통증", cause: "회전근개 불균형 및 견봉하 공간 협소화", mfr: "회전근개 후면 및 상완골두 주변 근막 이완", mob: "클락슬라이드 및 어깨 관절 가동 범위 회복", act: "사이드 레터럴 레이즈 (저강도) 및 밴드 외회전 운동", pas: "어깨 관절 후방 캡슐 스트레칭", tip: "팔을 들 때 어깨가 걸리는 느낌은 극상근 마찰과 회전근개 약화 신호입니다." },
            { id: 8, name: "장요근 단축 (골반 전방경사)", test: "Thomas Test 시 대퇴부가 바닥에서 뜨고 골반 전방 경사 유발 확인", loc: "고관절 전면 깊은 곳 및 요추 전정", pain: "허리 찝힘, 골반 앞쪽 뻐근함", cause: "좌식 생활로 인한 장요근의 단축 및 코어 약화", mfr: "폼롤러 및 전면 골반 부위 장요근 압박 이완", mob: "고관절 신전근 가동성 및 캐트카우 스트레칭", act: "데드버그 및 플랭크를 통한 코어/골반 안정화", pas: "하프닐링 일리오소아스 스트레칭", tip: "허리 찝힘과 골반 전방경사는 장요근 단축이 주범입니다. 고관절을 펴주는 훈련이 필수입니다." },
            { id: 9, name: "중둔근 약화 (골반 낙하/보행 불안정)", test: "Trendelenburg Test (한 발로 섰을 때 반대쪽 골반이 아래로 처지는지 확인)", loc: "골반 외측 상단 (대전자 위)", pain: "보행 시 골반 흔들림, 고관절 외측 통증", cause: "중둔근 약화로 인한 골반 측면 지지력 상실", mfr: "폼롤러를 이용한 중둔근 및 대퇴근막장근 이완", mob: "고관절 외전 가동성 확보", act: "클램쉘(Clamshell) 및 사이드 레그 레이즈 강화", pas: "고관절 내전근 스트레칭을 통한 중둔근 길항 이완", tip: "걸을 때 골반이 뚝뚝 떨어지거나 외측이 아프다면 중둔근의 측면 지지력을 높여야 합니다." },
            { id: 10, name: "이상근 증후군 (엉덩이 찌릿함)", test: "FAIR Test (고관절 굴곡, 내전, 내회전 시 좌골신경통 유사 방사통 유발)", loc: "엉덩이 심부 (좌골과 대퇴골 사이)", pain: "엉덩이 깊은 곳 찌릿함, 허벅지 뒤쪽으로 뻗치는 방사통", cause: "이상근 과긴장으로 인한 좌골신경 압박", mfr: "라크로스 볼을 이용한 엉덩이 심부 이상근 타겟 이완 (8분)", mob: "고관절 외회전 및 내회전 가동성 회복 훈련", act: "브릿지 및 힙힌지 패턴 재교육", pas: "피글렛(Figure-4) 스트레칭", tip: "엉덩이 깊은 곳의 찌릿함은 이상근이 좌골신경을 누르는 전형적인 증상입니다." }
        ];

        // 렌더링 초기화
        function initApp() {
            const listEl = document.getElementById('symptomList');
            listEl.innerHTML = symptomDatabase.map(item => `
                <div class="bg-slate-900/60 border border-slate-700/60 rounded-lg p-2.5 transition hover:border-slate-600">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2.5 cursor-pointer flex-1">
                            <input type="checkbox" value="${item.id}" onchange="updateCount()" class="symptom-checkbox w-4 h-4 text-emerald-500 rounded bg-slate-800 border-slate-600 focus:ring-emerald-500">
                            <span class="text-slate-200 font-medium text-sm">${item.name}</span>
                        </label>
                        <button type="button" onclick="toggleTest(${item.id})" class="text-xs text-emerald-400 hover:text-emerald-300 bg-emerald-950/60 border border-emerald-800/60 px-2 py-1 rounded transition">
                            🔍 TEST 보기
                        </button>
                    </div>
                    <!-- TEST 검사법 상세보기 아코디언 박스 -->
                    <div id="test-box-${item.id}" class="hidden mt-2 pt-2 border-t border-slate-800 text-xs text-slate-400 bg-slate-950/40 p-2 rounded">
                        <strong class="text-emerald-400">📋 평가 검사법:</strong> ${item.test}
                    </div>
                </div>
            `).join('');
            updateCount();
        }

        // 평가법 상세보기 아코디언 토글
        function toggleTest(id) {
            const box = document.getElementById(`test-box-${id}`);
            if (box) {
                box.classList.toggle('hidden');
            }
        }

        function updateCount() {
            const checked = document.querySelectorAll('.symptom-checkbox:checked').length;
            document.getElementById('checkedCount').innerText = `${checked}개 선택됨`;
        }

        // 리포트 생성 로직 (HTML 시각 카드 렌더링)
        function generateReport() {
            const checkedBoxes = document.querySelectorAll('.symptom-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("최소 1개 이상의 증상을 선택해주세요.");
                return;
            }

            const selectedIds = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
            const selectedSymptoms = symptomDatabase.filter(s => selectedIds.includes(s.id));

            const container = document.getElementById('cardContainer');
            container.innerHTML = selectedSymptoms.map((item, index) => `
                <div class="bg-slate-800 border border-emerald-500/40 rounded-xl p-4 shadow-xl space-y-3 relative overflow-hidden">
                    <div class="absolute top-0 right-0 bg-emerald-500 text-slate-950 font-bold text-xs px-3 py-1 rounded-bl-xl">
                        TP CARD #${index + 1}
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <span class="bg-emerald-500/20 text-emerald-400 font-bold text-xs px-2 py-1 rounded border border-emerald-500/30">TP ${item.id}</span>
                        <h4 class="font-bold text-base text-white">${item.name}</h4>
                    </div>

                    <div class="space-y-2 text-xs text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-slate-700">
                        <p>📍 <strong class="text-slate-200">해부학적 위치:</strong> ${item.loc}</p>
                        <p>⚡ <strong class="text-slate-200">통증 양상:</strong> ${item.pain}</p>
                        <p>🔍 <strong class="text-slate-200">핵심 원인:</strong> ${item.cause}</p>
                    </div>

                    <div class="bg-emerald-950/30 border border-emerald-500/30 rounded-lg p-3 space-y-2 text-xs">
                        <p class="font-semibold text-emerald-400 flex items-center space-x-1">
                            <span>🛠️ 실전 4단계 소도구 믹스 대처법</span>
                        </p>
                        <ul class="space-y-1 text-slate-300 pl-2">
                            <li>• <strong class="text-emerald-300">1단계 MFR (8분):</strong> ${item.mfr}</li>
                            <li>• <strong class="text-emerald-300">2단계 Mobility (10분):</strong> ${item.mob}</li>
                            <li>• <strong class="text-emerald-300">3단계 Active (12분):</strong> ${item.act}</li>
                            <li>• <strong class="text-emerald-300">4단계 Passive (5분):</strong> ${item.pas}</li>
                        </ul>
                    </div>

                    <div class="bg-slate-900/80 border border-slate-700 p-2.5 rounded-lg text-xs text-slate-300 flex items-start space-x-2">
                        <span class="text-amber-400">💡</span>
                        <div><strong class="text-slate-200">티칭 멘트:</strong> "${item.tip}"</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        // 초기 실행
        window.onload = initApp;
    </script>
</body>
</html>
